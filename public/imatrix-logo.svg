<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Central Base Sun / Pivot -->
  <path d="M 340 540 A 60 60 0 0 1 460 540 Z" fill="#38bdf8" />

  <!-- Radiating Sun Rays / Base Accents -->
  <polygon points="400,535 320,490 325,505" fill="#38bdf8" opacity="0.8" />
  <polygon points="400,535 480,490 475,505" fill="#38bdf8" opacity="0.8" />
  <polygon points="400,535 250,520 255,532" fill="#38bdf8" opacity="0.8" />
  <polygon points="400,535 550,520 545,532" fill="#38bdf8" opacity="0.8" />

  <!-- Left Open Book / Wings Layers -->
  <!-- Outer Layer Left -->
  <polygon points="100,120 145,150 145,430 350,535 340,540 85,420 85,140" fill="#60a5fa" filter="url(#subtleGlow)" />
  <!-- Mid Layer Left -->
  <polygon points="175,70 215,95 215,395 365,510 355,520 160,395 160,90" fill="#38bdf8" />
  <!-- Inner Layer Left -->
  <polygon points="265,30 300,50 300,360 380,480 370,490 250,370 250,50" fill="#2563eb" />

  <!-- Right Open Book / Wings Layers (Mirrored) -->
  <!-- Outer Layer Right -->
  <polygon points="700,120 655,150 655,430 450,535 460,540 715,420 715,140" fill="#60a5fa" filter="url(#subtleGlow)" />
  <!-- Mid Layer Right -->
  <polygon points="625,70 585,95 585,395 435,510 445,520 640,395 640,90" fill="#38bdf8" />
  <!-- Inner Layer Right -->
  <polygon points="535,30 500,50 500,360 420,480 430,490 550,370 550,50" fill="#2563eb" />

  <!-- Center Typography Container (White crisp card with brand text) -->
  <rect x="290" y="160" width="220" height="150" rx="8" fill="#ffffff" fill-opacity="0.95" />
  
  <!-- iMatrix Brand Title -->
  <text x="400" y="245" text-anchor="middle" font-family="'Times New Roman', 'Playfair Display', serif" font-weight="bold" font-size="52" fill="#0f172a" letter-spacing="1">
    iMatrix
  </text>
  
  <!-- TECHNOLOGY SOLUTIONS Subtitle -->
  <text x="400" y="280" text-anchor="middle" font-family="'Inter', 'Montserrat', sans-serif" font-weight="800" font-size="11" fill="#0f172a" letter-spacing="3.5">
    TECHNOLOGY SOLUTIONS
  </text>
</svg>
